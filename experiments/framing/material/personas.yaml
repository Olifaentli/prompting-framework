# Spezifikationsschema: Personenbeschreibungen mit zunehmendem Detailgrad.
#
# Konstruktionsprinzip: Die Stufen unterscheiden sich allein darin, WIE VIEL
# ueber die Person gesagt wird - nicht darin, WAS fuer eine Person es ist.
# Insbesondere enthaelt keine Beschreibung Angaben zur Risikoneigung, zu
# Vorsicht, Wagemut, Geld, Versicherungen, Gluecksspiel oder Sport. Andernfalls
# waere nicht trennbar, ob eine Verschiebung vom Detailgrad oder von einer
# mitgelieferten Disposition kommt.
#
#   S0  keine Beschreibung
#   S1  wenig    Alter und Beruf
#   S2  mehr     zusaetzlich Wohnsituation, Alltag, soziales Umfeld
#   S3  viel     zusaetzlich Bildungsweg, Gewohnheiten, eine konkrete Episode
#
# Je Stufe gibt es zwei Formulierungsvarianten mit verschiedenen Personen. Sie
# dienen der Kontrolle: Faellt das Ergebnis je Variante unterschiedlich aus,
# haengt es an der konkreten Formulierung und nicht am Detailgrad. Sclar et al.
# (2024) empfehlen ausdruecklich, Ergebnisse als Spannweite ueber plausible
# Prompt-Varianten zu berichten statt als Einzelwert.

# Im Versuchsplan eingesetzte Varianten. Eine dritte liesse sich hier ergaenzen,
# ohne den Code zu aendern; der Plan waechst dann auf 20 Zellen.
active_variants: [a, b]

levels:
  S0:
    label: "Baseline ohne Personenbeschreibung"
    has_variants: false
    template: null

  S1:
    label: "Wenig Detail: Alter und Beruf"
    has_variants: true
    variants:
      a: "You are 34 years old and work in the administration of a university."
      b: "You are 41 years old and teach geography at a secondary school."

  S2:
    label: "Mehr Detail: zusaetzlich Wohnsituation, Alltag und Umfeld"
    has_variants: true
    variants:
      a: >-
        You are 34 years old and work in the administration of a university in a
        mid-sized town. You rent a flat near the river and take the bus to work.
        Most evenings you cook at home, and every other week you meet two friends
        from your former department for dinner.
      b: >-
        You are 41 years old and teach geography at a secondary school on the edge
        of a large city. You live in a terraced house with a small garden and drive
        to work, listening to podcasts on the way. On Sunday afternoons you usually
        visit your sister and her children.

  S3:
    label: "Viel Detail: zusaetzlich Bildungsweg, Gewohnheiten und eine Episode"
    has_variants: true
    variants:
      a: >-
        You are 34 years old and work in the administration of a university in a
        mid-sized town, where you coordinate timetables for three departments. You
        studied cultural studies and moved into administration after a temporary
        contract turned permanent. You rent a flat near the river and take the bus
        to work, usually reading on the way. Most evenings you cook at home; you
        keep a handwritten notebook of recipes that your grandmother started. Every
        other week you meet two friends from your former department for dinner. Last
        month you spent a weekend repainting the kitchen and discovered that the
        previous tenant had left a layer of wallpaper underneath.
      b: >-
        You are 41 years old and teach geography at a secondary school on the edge of
        a large city, where you have also run the hiking club for six years. You
        trained as a teacher after working for a while in a map publisher's office,
        which is where your interest in landforms began. You live in a terraced house
        with a small garden and drive to work, listening to podcasts on the way. You
        water the tomatoes before breakfast and keep a weather log on the kitchen
        wall. On Sunday afternoons you usually visit your sister and her children.
        Last month the hiking club's trip was moved twice because of roadworks, and
        you spent an evening redrawing the route.

# Antwortformat. Bewusst ohne Begruendung: Payne (2025) zeigt, dass der
# Framing-Effekt vollstaendig verschwindet, sobald ein Modell die
# Erwartungswerte ausrechnet.
response_instruction: >-
  Answer with exactly one letter, either A or B, and nothing else.
